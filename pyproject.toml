[project]
name = "github-engineering-analytics"
version = "0.1.0"
description = "GitHub REST API -> PostgreSQL star schema engineering analytics, orchestrated by Airflow"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
]

[project.scripts]
gh-analytics = "github_analytics.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-requests>=2.32",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs PostgreSQL (TEST_POSTGRES_DSN) or Airflow installed; skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "dags"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "S", "PTH"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]
