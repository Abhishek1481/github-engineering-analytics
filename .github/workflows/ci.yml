name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Throwaway credentials for CI-only containers; not secrets.
  TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml with the example env file
        run: |
          cp .env.example .env
          docker compose config --quiet

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail on committed .env files or credential-looking strings
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env file committed"; exit 1
          fi
          if git grep -nE '(ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{50,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]+)' -- ':!*.md' ':!.github/**'; then
            echo "::error::possible credential committed"; exit 1
          fi
          echo "no secrets found"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Start PostgreSQL 16
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres             postgres:16 -c wal_level=logical -c max_replication_slots=4
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 2; done
      - run: uv sync --locked
      - name: Unit + integration tests
        run: uv run pytest --cov=src --cov-report=term-missing

  airflow-dags:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_VERSION: "3.3.2"
      PYTHON_VERSION: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install Airflow with its official constraints, plus the project
        run: |
          uv venv --python "$PYTHON_VERSION" .airflow-venv
          uv pip install --python .airflow-venv             "apache-airflow==${AIRFLOW_VERSION}" -e . pytest responses             --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
      - name: DAG import and structure tests
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
        run: .airflow-venv/bin/python -m pytest tests/integration/test_dag.py -v
